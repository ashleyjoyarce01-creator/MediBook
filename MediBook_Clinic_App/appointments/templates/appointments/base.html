{% load static %}<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}MediBook{% endblock %}</title><link rel="stylesheet" href="{% static 'appointments/css/site.css' %}"><script defer src="https://unpkg.com/htmx.org@2.0.4"></script><script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/persist@3.14.9/dist/cdn.min.js"></script><script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"></script><script defer src="{% static 'appointments/js/app.js' %}"></script></head><body :class="$store.theme.dark ? 'dark-mode' : ''"><header><a class="brand" href="{% url 'doctor_list' %}">✚ MediBook</a><nav x-data="{open:false}"><button class="menu" @click="open=!open" :aria-expanded="open">☰</button><div class="links" x-show="open || window.innerWidth > 600" x-transition @keydown.escape.window="open=false" :class="{'open':open}"><a href="{% url 'doctor_list' %}" @click="open=false">Find a doctor</a><a href="{% url 'manage_doctors' %}" @click="open=false">Manage doctors</a><a href="{% url 'manage_appointments' %}" @click="open=false">Appointments</a><button @click="$store.theme.toggle()" x-text="$store.theme.dark?'☀ Light':'☾ Dark'"></button></div></nav></header><main class="wrap">{% if messages %}{% for message in messages %}<p class="notice">{{ message }}</p>{% endfor %}{% endif %}{% block content %}{% endblock %}</main><div class="toasts" @toast.window="$store.toasts.add($event.detail?.message || 'Updated successfully', $event.detail?.type || 'success')"><template x-for="t in $store.toasts.items" :key="t.id"><div class="toast" x-transition><span x-text="t.message"></span><button @click="$store.toasts.remove(t.id)">×</button></div></template></div><footer>MediBook Clinic · Your care, made simpler.</footer></body></html>
