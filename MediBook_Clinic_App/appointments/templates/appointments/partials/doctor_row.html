<tr id="doctor-{{ doctor.pk }}"><td>{{ doctor.pk }}</td><td>{{ doctor.full_name }}</td><td>{{ doctor.specialty.name }}</td><td>₱{{ doctor.consultation_fee|floatformat:2 }}</td><td>{% if doctor.is_accepting %}Accepting{% else %}Not accepting{% endif %}</td><td><a href="{% url 'doctor_edit' doctor.pk %}">Edit</a><form class="inline" method="post" action="{% url 'toggle' doctor.pk %}" hx-post="{% url 'toggle' doctor.pk %}" hx-target="#doctor-{{ doctor.pk }}" hx-swap="outerHTML">{% csrf_token %}<button>Toggle</button></form><form class="inline" method="post" action="{% url 'delete_doctor' doctor.pk %}" hx-post="{% url 'delete_doctor' doctor.pk %}" hx-target="closest tr" hx-swap="outerHTML" hx-confirm="Delete this doctor?">{% csrf_token %}<button>Delete</button></form></td></tr>
